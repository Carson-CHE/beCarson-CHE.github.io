<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="数学王国">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#4A90E2">
<title>数学王国 · 小学数学趣味学习平台</title>
<style>
/* ========== 基础 ========== */
:root {
  --p: #4A90E2;
  --p2: #63B3ED;
  --a: #F5A623;
  --s: #7ED321;
  --d: #FF5252;
  --bg1: #E8F4FD;
  --bg2: #FFF1E6;
  --card: #ffffff;
  --text: #2D3748;
  --text2: #718096;
  --radius: 1.2rem;
  --shadow: 0 8px 24px rgba(74,144,226,0.12);
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  font-family: "PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color: var(--text);
  background: linear-gradient(135deg, var(--bg1), var(--bg2));
  background-attachment: fixed;
  overflow-x: hidden;
}
button { font-family: inherit; cursor:pointer; border:none; outline:none; }
input { font-family: inherit; outline:none; }

/* 视图切换 */
.view { display:none; min-height:100vh; position:relative; }
.view.active { display:flex; flex-direction:column; }
.page { display:none; padding: 1.5rem 2rem 3rem; max-width: 1100px; margin:0 auto; width:100%; }
.page.active { display:block; }

/* 装饰背景（浮动emoji） */
.bg-decor { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.bg-decor span {
  position:absolute; font-size: 2.5rem; opacity:.12; animation: float 6s ease-in-out infinite alternate; user-select:none;
}
@keyframes float { 0%{transform:translateY(0) rotate(-8deg)} 100%{transform:translateY(-40px) rotate(8deg)} }

/* ========== 登录页 ========== */
#authView { align-items:center; justify-content:center; }
.auth-card { background: var(--card); padding: 2.5rem; border-radius: var(--radius); box-shadow: var(--shadow); width: 92%; max-width: 420px; text-align:center; z-index:1; position:relative; }
.auth-logo { font-size: 3.5rem; line-height:1; }
.auth-title { font-size: 1.8rem; color: var(--p); margin:.4rem 0 .2rem; }
.auth-sub { color: var(--text2); font-size:.95rem; margin-bottom: 1.2rem; }
.auth-tabs { display:flex; gap:.5rem; margin-bottom:1rem; background:#F0F5FF; border-radius:.8rem; padding:.25rem; }
.auth-tab { flex:1; padding:.55rem 0; border-radius:.6rem; background:transparent; color:#6B7C93; font-weight:600; font-size:.95rem; transition:.2s; }
.auth-tab.active { background:#fff; color:var(--p); box-shadow:0 2px 8px rgba(74,144,226,.15); }
.auth-form input { width:100%; padding:.7rem .9rem; border:2px solid #E2E8F0; border-radius:.8rem; font-size:1rem; margin-bottom:.7rem; transition:.2s; }
.auth-form input:focus { border-color: var(--p); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:.35rem; padding:.65rem 1.2rem; border-radius: 999px; font-weight:700; font-size:.95rem; transition:.2s; }
.btn-lg { width:100%; padding:.85rem; font-size:1.05rem; }
.btn-primary { background: linear-gradient(135deg, var(--p), var(--p2)); color:#fff; box-shadow: 0 4px 14px rgba(74,144,226,.35); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(74,144,226,.4); }
.btn-ghost { background:rgba(255,255,255,.7); color: var(--text2); border:1px solid #E2E8F0; }
.btn-ghost:hover { background:#fff; }
.btn-hint { background:#FFF9E6; color:#B7791F; border:1px solid #FBD38D; font-size:.85rem; padding:.45rem .9rem; }
.btn-hint:disabled { opacity:.4; cursor:not-allowed; }
.auth-msg { font-size:.85rem; color:var(--d); margin-top:.5rem; min-height:1.2rem; }
.auth-tip { font-size:.75rem; color:#A0AEC0; margin-top:.8rem; }

/* ========== 顶栏 ========== */
.topbar { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.8rem 1.5rem; background:rgba(255,255,255,.85); backdrop-filter:blur(10px); position:sticky; top:0; z-index:10; border-bottom:1px solid rgba(0,0,0,.04); flex-wrap:wrap; }
.topbar-left { display:flex; align-items:center; gap:.5rem; cursor:pointer; font-weight:800; font-size:1.15rem; color: var(--p); }
.topnav { display:flex; gap:.3rem; flex-wrap:wrap; }
.nav-btn { padding:.5rem .9rem; border-radius:999px; font-weight:600; background:transparent; color:#6B7C93; font-size:.9rem; }
.nav-btn.active { background: #EBF5FF; color: var(--p); }
.topbar-right { display:flex; align-items:center; gap:.7rem; }
.streak-pill, .star-pill { background:#FFF0E6; color:#D97706; padding:.35rem .7rem; border-radius:999px; font-size:.85rem; font-weight:700; }
.star-pill { background:#FFFDE7; color:#F59E0B; }
.user-chip { display:flex; align-items:center; gap:.4rem; cursor:pointer; position:relative; padding:.25rem .6rem .25rem .25rem; border-radius:999px; background:#F0F5FF; }
.user-avatar { font-size:1.4rem; line-height:1; }
.user-menu { position:absolute; top:110%; right:0; background:#fff; border-radius:.8rem; box-shadow:var(--shadow); padding:.3rem; display:none; min-width:120px; }
.user-chip:hover .user-menu { display:block; }
.user-menu button { width:100%; text-align:left; padding:.5rem .7rem; border-radius:.6rem; background:transparent; color:#4A5568; font-size:.9rem; font-weight:600; }
.user-menu button:hover { background:#F7FAFC; }

/* ========== 仪表盘 ========== */
.dash-hero { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1.5rem; background: var(--card); border-radius: var(--radius); padding: 1.5rem 2rem; box-shadow: var(--shadow); margin-bottom:1.5rem; }
.dash-hello h2 { font-size:1.5rem; margin-bottom:.2rem; }
.dash-hello p { color: var(--text2); margin-bottom:.8rem; }
.level-wrap { display:flex; align-items:center; gap:.8rem; }
.level-badge { width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg,var(--p),var(--p2)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.85rem; flex-shrink:0; }
.level-info { flex:1; }
.level-name { font-weight:700; color:var(--p); font-size:.95rem; }
.level-bar { height:10px; background:#EDF2F7; border-radius:999px; margin:.3rem 0; overflow:hidden; }
.level-fill { height:100%; background:linear-gradient(90deg,var(--a),#FBD38D); border-radius:999px; width:0%; transition:width .6s; }
.level-xp { font-size:.75rem; color:#A0AEC0; }
.goal-ring-wrap { position:relative; width:110px; height:110px; }
.goal-ring { transform:rotate(-90deg); width:110px; height:110px; }
.ring-bg { fill:none; stroke:#EDF2F7; stroke-width:10; }
.ring-fill { fill:none; stroke:var(--s); stroke-width:10; stroke-linecap:round; stroke-dasharray:327; stroke-dashoffset:327; transition:stroke-dashoffset .8s ease; }
.goal-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.goal-num { font-size:1.2rem; font-weight:800; color:var(--s); }
.goal-label { font-size:.7rem; color:#A0AEC0; }

.section-title { font-size:1.1rem; margin:1.6rem 0 .7rem; color:#2D3748; }

/* 推荐 */
.reco-list { display:flex; flex-direction:column; gap:.7rem; }
.reco-card { display:flex; align-items:center; gap:1rem; background:var(--card); border-radius:1rem; padding:1rem 1.2rem; box-shadow:var(--shadow); cursor:pointer; transition:.2s; border-left:5px solid var(--p); }
.reco-card:hover { transform:translateX(4px); }
.reco-icon { font-size:2rem; }
.reco-title { font-weight:700; }
.reco-desc { font-size:.82rem; color:var(--text2); }

/* 年级卡片 */
.grade-cards { display:flex; flex-direction:column; gap:1rem; }
.grade-card { background:var(--card); border-radius:var(--radius); padding:1.2rem; box-shadow:var(--shadow); cursor:pointer; transition:.2s; }
.grade-card:hover { transform:translateY(-3px); }
.grade-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:.5rem; }
.grade-name { font-size:1.15rem; font-weight:800; }
.grade-progress-label { font-size:.8rem; color:var(--text2); }
.grade-bar-bg { height:10px; background:#EDF2F7; border-radius:999px; overflow:hidden; }
.grade-bar-fill { height:100%; border-radius:999px; width:0%; transition:width .8s; }
.grade-stats { display:flex; gap:1rem; margin-top:.6rem; font-size:.82rem; color:var(--text2); flex-wrap:wrap; }

/* 快捷入口 */
.quick-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:1rem; }
.quick-card { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.3rem; padding:1.2rem 1rem; border-radius:var(--radius); color:#fff; font-weight:800; font-size:1.05rem; box-shadow:var(--shadow); transition:.2s; }
.quick-card:hover { transform:translateY(-4px); }
.quick-card small { font-size:.78rem; font-weight:500; opacity:.9; }
.q-oral { background:linear-gradient(135deg,#FF8F00,#FFB74D); }
.q-practice { background:linear-gradient(135deg,#43A047,#81C784); }
.q-test { background:linear-gradient(135deg,#7E57C2,#BA68C8); }
.q-wrong { background:linear-gradient(135deg,#E53935,#EF5350); }
.quick-icon { font-size:2.2rem; }

/* ========== 课程页 ========== */
.grade-tabs { display:flex; gap:.5rem; margin-bottom:1rem; }
.grade-tab { flex:1; padding:.75rem; border-radius:1rem; font-weight:700; font-size:1rem; background:#fff; color:#6B7C93; box-shadow:0 2px 8px rgba(0,0,0,.05); transition:.2s; }
.grade-tab.active { background:linear-gradient(135deg,var(--p),var(--p2)); color:#fff; }
.unit-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:1rem; }

/* 年级综合测试栏目 */
.mix-card {
  grid-column:1/-1; display:flex; align-items:center; gap:1rem;
  background:linear-gradient(135deg,#4A90E2,#7E57C2); color:#fff;
  border-radius:var(--radius); padding:1.1rem 1.3rem;
  box-shadow:0 8px 24px rgba(74,144,226,.28); cursor:pointer; transition:.2s;
}
.mix-card:hover { transform:translateY(-3px); box-shadow:0 12px 30px rgba(74,144,226,.34); }
.mix-icon { font-size:2.1rem; line-height:1; }
.mix-info { flex:1; min-width:0; }
.mix-title { font-weight:800; font-size:1.08rem; }
.mix-desc { font-size:.8rem; opacity:.92; margin-top:.2rem; }
.mix-side { text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:.3rem; }
.mix-best { font-size:.75rem; background:rgba(255,255,255,.22); padding:.2rem .6rem; border-radius:999px; white-space:nowrap; }
.mix-best.none { background:rgba(255,255,255,.12); opacity:.85; }
.mix-go { font-weight:800; font-size:.86rem; white-space:nowrap; }

/* 一年级 · 进阶练习（凑十法 / 破十法） */
.adv-card {
  grid-column:1/-1; background:var(--card); border-radius:var(--radius);
  padding:1.1rem 1.3rem; box-shadow:var(--shadow); border:2px solid #E6F0FF;
}
.adv-card-head { display:flex; align-items:center; gap:.9rem; }
.adv-icon { font-size:2.1rem; line-height:1; }
.adv-info { flex:1; min-width:0; }
.adv-title { font-weight:800; font-size:1.06rem; color:#2D3748; }
.adv-desc { font-size:.8rem; color:var(--text2); margin-top:.25rem; }
.adv-tag {
  display:inline-block; background:#EBF5FF; color:var(--p); font-weight:700;
  border-radius:999px; padding:.05rem .45rem; margin:0 .15rem; font-size:.78rem;
}
.adv-btns { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-top:.9rem; }
.adv-lv {
  display:flex; flex-direction:column; align-items:flex-start; gap:.15rem;
  padding:.75rem .9rem; border-radius:.9rem; text-align:left;
  background:#F7FAFC; border:2px solid #E2E8F0; transition:.15s;
}
.adv-lv:hover { transform:translateY(-2px); border-color:var(--p2); background:#fff; }
.adv-lv.lv-a { border-color:#BEE3F8; background:#EBF8FF; }
.adv-lv.lv-b { border-color:#FBD38D; background:#FFFAF0; }
.adv-lv-name { font-weight:800; font-size:.95rem; color:var(--p); }
.adv-lv.lv-b .adv-lv-name { color:#B7791F; }
.adv-lv-desc { font-size:.8rem; color:var(--text2); }
.adv-lv-best { font-size:.74rem; color:#A0AEC0; margin-top:.15rem; }

/* 分步解题 */
.quiz-steps { text-align:left; margin-bottom:.9rem; }
.adv-head { display:flex; align-items:center; gap:.6rem; justify-content:center; margin-bottom:1rem; flex-wrap:wrap; }
.adv-method { background:#EBF5FF; color:var(--p); font-weight:800; font-size:.85rem; padding:.2rem .6rem; border-radius:999px; }
.adv-expr { font-size:1.35rem; font-weight:800; color:#2D3748; }
.adv-step {
  display:flex; align-items:center; gap:.6rem; padding:.65rem .8rem;
  border-radius:.85rem; background:#F7FAFC; border:2px solid transparent;
  margin-bottom:.55rem; font-size:1rem; color:var(--text2); transition:.2s;
}
.adv-step.active { background:#fff; border-color:var(--p2); color:var(--text); box-shadow:0 4px 14px rgba(74,144,226,.14); }
.adv-step.done { background:#E8F5E9; color:#2E7D32; }
.adv-step.todo { opacity:.6; }
.adv-step-no {
  flex-shrink:0; width:1.6rem; height:1.6rem; border-radius:50%;
  background:#E2E8F0; color:#718096; font-weight:800; font-size:.8rem;
  display:flex; align-items:center; justify-content:center;
}
.adv-step.active .adv-step-no { background:var(--p); color:#fff; }
.adv-step.done .adv-step-no { background:var(--s); color:#fff; }
.adv-step-text { flex:1; line-height:1.7; font-weight:700; }
.adv-input {
  width:4.2rem; padding:.15rem .3rem; margin:0 .2rem;
  font-size:1.1rem; font-weight:800; text-align:center; color:var(--p);
  border:none; border-bottom:3px solid var(--p); background:transparent;
  vertical-align:baseline;
}
.adv-input::placeholder { color:#CBD5E0; font-weight:700; }
.adv-input::-webkit-outer-spin-button, .adv-input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
.adv-val {
  display:inline-block; min-width:2.2rem; text-align:center;
  color:#2E7D32; font-weight:800; border-bottom:3px solid var(--s);
}
.adv-blank { display:inline-block; min-width:2.2rem; text-align:center; color:#A0AEC0; border-bottom:3px dashed #E2E8F0; }
.unit-card { background:var(--card); border-radius:var(--radius); padding:1.2rem; box-shadow:var(--shadow); cursor:pointer; transition:.2s; position:relative; overflow:hidden; }
.unit-card:hover { transform:translateY(-3px); }
.unit-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:6px; border-radius:var(--radius) 0 0 var(--radius); background:var(--p); opacity:.3; }
.unit-card.done::before { opacity:1; background:var(--s); }
.unit-top { display:flex; align-items:center; gap:.7rem; margin-bottom:.5rem; }
.unit-icon { font-size:1.8rem; }
.unit-title { font-weight:700; font-size:1.05rem; }
.unit-desc { font-size:.82rem; color:var(--text2); margin-bottom:.6rem; }
.unit-meta { display:flex; align-items:center; justify-content:space-between; font-size:.8rem; color:#A0AEC0; }
.unit-stars { color:#F5A623; font-size:.95rem; }

/* ========== 错题本页 ========== */
.wrong-head { display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:1rem; margin-bottom:.8rem; }
.wrong-sub { color:var(--text2); font-size:.88rem; }
.wrong-actions { display:flex; gap:.6rem; flex-wrap:wrap; }
.wrong-filter { display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:.9rem; }
.wf-chip { padding:.35rem .8rem; border-radius:999px; background:#fff; color:#6B7C93; font-size:.82rem; font-weight:600; border:1px solid #E2E8F0; transition:.15s; }
.wf-chip.active { background:var(--p); color:#fff; border-color:var(--p); }
.wrong-list { display:flex; flex-direction:column; gap:.6rem; }
.wrong-row { background:var(--card); border-radius:.9rem; padding:.9rem 1.1rem; box-shadow:0 2px 8px rgba(0,0,0,.04); display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; }
.wrong-row.mastered { opacity:.65; }
.wrong-q { flex:1; min-width:200px; font-weight:600; font-size:.95rem; line-height:1.5; }
.wrong-a { color:#43A047; font-weight:700; white-space:nowrap; font-size:.9rem; }
.wrong-tag { background:#F0F5FF; color:var(--p); font-size:.72rem; font-weight:700; padding:.2rem .55rem; border-radius:999px; white-space:nowrap; }
.wrong-status { font-size:.75rem; font-weight:700; padding:.2rem .55rem; border-radius:999px; white-space:nowrap; }
.wrong-status.todo { background:#FFEBEE; color:#E53935; }
.wrong-status.ok { background:#E8F5E9; color:#43A047; }
.wrong-date { font-size:.72rem; color:#A0AEC0; }
.wrong-empty { text-align:center; padding:3rem 1rem; color:var(--text2); }
.wrong-empty .big { font-size:3.5rem; display:block; margin-bottom:.6rem; }
.result-wrongtip { font-size:.85rem; color:#E53935; background:#FFEBEE; border-radius:.6rem; padding:.5rem .8rem; margin-bottom:1rem; display:none; }

/* ========== 弹窗 ========== */
.modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; z-index:50; padding:1rem; }
.modal-mask.open { display:flex; }
.modal-card { background:var(--card); border-radius:var(--radius); padding:2rem; max-width:440px; width:100%; position:relative; box-shadow:var(--shadow); }
.modal-close { position:absolute; top:.8rem; right:.8rem; width:32px; height:32px; border-radius:50%; background:#F7FAFC; color:#718096; font-size:1.1rem; display:flex; align-items:center; justify-content:center; }
.unit-modal-head { font-size:1.25rem; font-weight:800; margin-bottom:.3rem; display:flex; align-items:center; gap:.5rem; }
.unit-modal-desc { color:var(--text2); font-size:.9rem; margin-bottom:1rem; }
.unit-modal-progress { margin-bottom:1.2rem; }
.mode-btns { display:flex; flex-direction:column; gap:.6rem; }
.mode-btn { display:flex; align-items:center; gap:.8rem; padding:.9rem 1.1rem; border-radius:.9rem; background:#F7FAFC; font-weight:700; font-size:1rem; color:var(--text); transition:.2s; text-align:left; }
.mode-btn span { font-size:1.6rem; }
.mode-btn small { display:block; font-size:.75rem; color:var(--text2); font-weight:500; margin-top:.15rem; }
.mode-btn:hover { transform:scale(1.02); }
.m-oral { border-left:5px solid #FF8F00; }
.m-practice { border-left:5px solid var(--s); }
.m-test { border-left:5px solid #7E57C2; }

/* ========== 答题页 ========== */
#quizView { background: linear-gradient(135deg, #E3F2FD, #FFF3E0); align-items:center; }
.quiz-top { width:100%; max-width:800px; display:flex; align-items:center; justify-content:space-between; padding:.8rem 1.2rem; }
.quiz-title { font-weight:800; font-size:1.1rem; color:var(--p); }
.quiz-timer { font-weight:700; color:#D97706; background:#FFF8E1; padding:.35rem .8rem; border-radius:999px; font-size:.95rem; }
.quiz-progress { width:100%; max-width:800px; height:8px; background:rgba(0,0,0,.06); border-radius:999px; overflow:hidden; margin-bottom:.8rem; }
.quiz-progress-fill { height:100%; background:linear-gradient(90deg,var(--p),var(--a)); width:0%; transition:width .3s; }
.quiz-card { background:var(--card); border-radius:var(--radius); padding:2rem 1.5rem; max-width:800px; width:92%; box-shadow:var(--shadow); text-align:center; position:relative; z-index:1; }
.quiz-streak { font-size:.85rem; color:var(--a); font-weight:700; min-height:1.4rem; margin-bottom:.4rem; }
.quiz-q { font-size: clamp(1.4rem, 4vw, 2rem); font-weight:700; margin: 1rem 0 1.5rem; line-height:1.6; min-height:4rem; display:flex; align-items:center; justify-content:center; }
/* 题面内层：普通块级容器，保证含 <br>、emoji 的多行题目按正常段落排版（外层 flex 只负责整体垂直居中） */
.quiz-q-inner { width:100%; text-align:center; }
/* 图形/动物行：独立成行并统一字形垂直度量，避免与上下文字产生落差 */
.quiz-q-inner .emoji-row { display:block; line-height:1.35; letter-spacing:.12em; margin:.1em 0 .35em; }
.quiz-q-inner .emoji-row .emoji { display:inline-block; vertical-align:middle; line-height:1; }
.quiz-choices { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:1rem; }
.choice-btn { padding:.9rem .6rem; border-radius:.9rem; background:#F7FAFC; font-weight:700; font-size:1.05rem; color:var(--text); border:2px solid transparent; transition:.15s; }
.choice-btn:hover { border-color:var(--p2); }
.choice-btn.correct { background:#E8F5E9; border-color:var(--s); color:#2E7D32; }
.choice-btn.wrong { background:#FFEBEE; border-color:var(--d); color:#C62828; }
.quiz-input-wrap { margin-bottom:1rem; }
.quiz-input { width:100%; padding:.7rem; font-size:1.4rem; font-weight:700; text-align:center; border:2px solid #E2E8F0; border-radius:.8rem; margin-bottom:.8rem; }
.quiz-input:focus { border-color:var(--p); }
.keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; max-width:320px; margin:0 auto; }
.keypad-btn { padding:.8rem; font-size:1.2rem; font-weight:700; border-radius:.7rem; background:#F7FAFC; transition:.1s; }
.keypad-btn:active { transform:scale(.96); background:#E2E8F0; }
.quiz-actions { display:flex; justify-content:center; gap:.8rem; margin-top:.6rem; }
.quiz-feedback { min-height:1.8rem; margin-top:.6rem; font-weight:700; font-size:1rem; }

/* ========== 结果页 ========== */
#resultView { align-items:center; justify-content:center; background:linear-gradient(135deg, #FFFDE7, #F3E5F5); }
.result-card { background:var(--card); border-radius:var(--radius); padding:2rem; max-width:520px; width:92%; text-align:center; box-shadow:var(--shadow); max-height:92vh; overflow:auto; }
.result-emoji { font-size:4rem; animation: bounce 1.2s infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
.result-card h2 { margin:.5rem 0; color:var(--p); }
.result-stars { font-size:2.2rem; margin:.5rem 0; }
.result-score { font-size:1.1rem; color:var(--text2); margin-bottom:1rem; }
.result-detail { background:#F7FAFC; border-radius:.8rem; padding:1rem; font-size:.9rem; color:#4A5568; margin-bottom:1rem; display:grid; grid-template-columns:1fr 1fr; gap:.5rem; }
.result-review { text-align:left; margin-bottom:1rem; max-height:220px; overflow:auto; }
.review-row { display:flex; align-items:center; gap:.5rem; padding:.45rem .5rem; border-radius:.5rem; margin-bottom:.2rem; font-size:.9rem; flex-wrap:wrap; }
.review-row.ok { background:#E8F5E9; }
.review-row.bad { background:#FFEBEE; }
.result-btns { display:flex; gap:.7rem; justify-content:center; flex-wrap:wrap; }

/* ========== 成就页 ========== */
.ach-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:1rem; }
.ach-item { background:var(--card); border-radius:var(--radius); padding:1rem .8rem; text-align:center; box-shadow:var(--shadow); transition:.2s; opacity:.55; }
.ach-item.unlocked { opacity:1; border:2px solid var(--a); }
.ach-icon { font-size:2.2rem; margin-bottom:.4rem; }
.ach-name { font-weight:700; font-size:.92rem; }
.ach-desc { font-size:.75rem; color:var(--text2); margin-top:.2rem; }
.ach-date { font-size:.7rem; color:#A0AEC0; margin-top:.3rem; }

/* ========== 统计页 ========== */
.stat-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:1rem; margin-bottom:1.5rem; }
.stat-card { background:var(--card); border-radius:var(--radius); padding:1rem; text-align:center; box-shadow:var(--shadow); }
.stat-num { font-size:1.6rem; font-weight:800; color:var(--p); }
.stat-label { font-size:.82rem; color:var(--text2); margin-top:.2rem; }
.chart-box { background:var(--card); border-radius:var(--radius); padding:1.2rem; box-shadow:var(--shadow); margin-bottom:1.5rem; }
.bar-chart { display:flex; align-items:flex-end; gap:.7rem; height:160px; }
.bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:.3rem; }
.bar { width:100%; border-radius:.5rem .5rem 0 0; background:linear-gradient(180deg,var(--p2),var(--p)); min-height:4px; transition:height .6s; }
.bar-label { font-size:.72rem; color:#A0AEC0; }
.unit-stats { display:flex; flex-direction:column; gap:.6rem; }
.us-row { display:flex; align-items:center; gap:.8rem; background:var(--card); border-radius:.8rem; padding:.7rem 1rem; box-shadow:0 2px 8px rgba(0,0,0,.04); }
.us-name { flex:1; font-size:.9rem; font-weight:600; }
.us-bar-bg { width:120px; height:8px; background:#EDF2F7; border-radius:999px; overflow:hidden; }
.us-bar-fill { height:100%; background:var(--s); border-radius:999px; }
.us-val { font-size:.8rem; color:#A0AEC0; min-width:3.5rem; text-align:right; }

/* ========== 成就解锁弹窗 ========== */
.ach-unlock { background:var(--card); border-radius:var(--radius); padding:2rem; max-width:360px; width:100%; text-align:center; position:relative; box-shadow:var(--shadow); overflow:hidden; }
.ach-unlock-rays { position:absolute; inset:-40px; background:radial-gradient(circle, rgba(245,166,35,.2), transparent 70%); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }
.ach-unlock-icon { font-size:4rem; position:relative; z-index:1; animation: pop .5s cubic-bezier(.175,.885,.32,1.275); }
@keyframes pop { 0%{transform:scale(0)} 100%{transform:scale(1)} }
.ach-unlock h3 { position:relative; z-index:1; margin:.6rem 0 .3rem; color:var(--a); }
.ach-unlock-name { position:relative; z-index:1; font-weight:800; font-size:1.1rem; margin-bottom:.2rem; }
.ach-unlock-desc { position:relative; z-index:1; font-size:.85rem; color:var(--text2); margin-bottom:1rem; }

/* ========== 彩带 ========== */
#confettiBox { position:fixed; inset:0; pointer-events:none; z-index:60; overflow:hidden; }
.confetti { position:absolute; width:10px; height:10px; border-radius:50%; animation: confettiFall 1.2s linear forwards; }
@keyframes confettiFall { 0%{transform:translateY(-20px) rotate(0)} 100%{transform:translateY(100vh) rotate(720deg); opacity:0} }

/* ========== 通用动画 ========== */
.pop-in { animation: popIn .45s cubic-bezier(.175,.885,.32,1.275); }
@keyframes popIn { from{opacity:0; transform:translateY(20px) scale(.96)} to{opacity:1; transform:none} }

.shake { animation: shake .35s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }

/* ========== 响应式 ========== */
@media (max-width: 700px) {
  .page { padding: 1rem; }
  .dash-hero { flex-direction:column; text-align:center; }
  .level-wrap { justify-content:center; }
  .quiz-choices { grid-template-columns:1fr; }
  .quiz-card { padding:1.2rem 1rem; }
  .wrong-head { flex-direction:column; }
}

/* ========== 移动端适配（iPhone / Android 手机） ========== */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { overscroll-behavior-y: contain; -webkit-tap-highlight-color: transparent; }

/* 刘海屏安全区 */
.topbar { padding-top: calc(.8rem + env(safe-area-inset-top)); padding-bottom: calc(.8rem + env(safe-area-inset-bottom)); }
#quizView .quiz-top { padding-top: calc(.8rem + env(safe-area-inset-top)); }
.page { padding-bottom: calc(2.5rem + env(safe-area-inset-bottom)); }

/* 触控目标 ≥ 44px，手感更稳 */
.nav-btn, .auth-tab, .choice-btn, .keypad-btn, .quick-card, .grade-tab,
.mode-btn, .wf-chip, .reco-card, .unit-card, .grade-card, .ach-item,
.wrong-row .btn, .modal-close {
  min-height: 44px;
}

@media (max-width: 740px) {
  /* 顶栏：两行布局，导航横向滑动 */
  .topbar { gap:.5rem; }
  .topnav { order:3; width:100%; display:flex; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:.2rem; scrollbar-width:none; }
  .topnav::-webkit-scrollbar { display:none; }
  .nav-btn { flex:0 0 auto; padding:.55rem 1rem; font-size:.9rem; }
  .topbar-right { margin-left:auto; }
  .user-chip span:last-child { max-width:72px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .page { padding:.9rem .8rem calc(2.5rem + env(safe-area-inset-bottom)); }
  .section-title { margin-top:1.2rem; }

  /* 首页 */
  .dash-hero { padding:1.1rem 1rem; gap:1rem; }
  .dash-hero h2 { font-size:1.25rem; }
  .goal-ring-wrap { width:96px; height:96px; }
  .goal-ring { width:96px; height:96px; }
  .quick-grid { grid-template-columns:repeat(2,1fr); gap:.7rem; }
  .quick-card { padding:1rem .6rem; font-size:.95rem; }

  /* 课程 */
  .grade-tabs { gap:.4rem; }
  .grade-tab { padding:.7rem .4rem; font-size:.9rem; }
  .unit-list { grid-template-columns:1fr; gap:.7rem; }
  .mix-card { flex-wrap:wrap; padding:1rem; gap:.7rem; }
  .mix-info { flex:1 1 60%; }
  .mix-side { flex:1 1 100%; flex-direction:row; align-items:center; justify-content:space-between; }
  .mix-desc { font-size:.75rem; }
  .unit-card, .mode-btn { padding:1rem; }

  /* 弹窗 */
  .modal-card { padding:1.4rem 1.1rem; max-height:86vh; overflow-y:auto; }
  .mode-btns { gap:.5rem; }

  /* 错题本 */
  .wrong-row { padding:.8rem .9rem; gap:.5rem; }
  .wrong-q { min-width:100%; order:-1; }
  .wrong-actions { width:100%; }
  .wrong-actions .btn { flex:1; }

  /* 成就 / 统计 */
  .ach-grid { grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:.7rem; }
  .stat-cards { grid-template-columns:repeat(2,1fr); gap:.7rem; }
  .us-row { flex-wrap:wrap; }
  .us-name { flex:1 1 55%; }
  .us-bar-bg { flex:1 1 100%; order:4; width:auto; }
  .us-val { margin-left:auto; }
}

/* 答题页：占满整屏、键盘易点 */
@media (max-width: 740px) {
  #quizView { height:100dvh; }
  .quiz-card { width:calc(100% - 1.2rem); padding:1.2rem .9rem calc(1rem + env(safe-area-inset-bottom)); max-height:calc(100dvh - 120px); overflow-y:auto; }
  .quiz-q { min-height:3.2rem; font-size:1.5rem; margin:.6rem 0 1rem; }
  .choice-btn { padding:1.05rem .6rem; font-size:1.15rem; }
  .quiz-choices { gap:.6rem; }
  .quiz-input { font-size:1.7rem; padding:.65rem; }
  .keypad { max-width:none; grid-template-columns:repeat(3,1fr); gap:.55rem; }
  .keypad-btn { padding:1rem 0; font-size:1.35rem; border-radius:.8rem; }
  .quiz-actions { position:sticky; bottom:env(safe-area-inset-bottom); }
  .quiz-actions .btn { flex:1; padding:.8rem; }
  .adv-btns { gap:.55rem; }
  .adv-lv { padding:.65rem .7rem; }
  .adv-step { font-size:.95rem; padding:.6rem .7rem; gap:.5rem; }
  .adv-expr { font-size:1.2rem; }
  .adv-input { width:3.6rem; font-size:1.05rem; }
  .quiz-top { padding-left:.8rem; padding-right:.8rem; }
  .quiz-title { font-size:.95rem; }
}

/* 超小屏（iPhone SE 等 ≤380px） */
@media (max-width: 380px) {
  .logo-text { display:none; }
  .streak-pill, .star-pill { font-size:.75rem; padding:.3rem .5rem; }
  .quiz-q { font-size:1.3rem; }
  .adv-btns { grid-template-columns:1fr; }
  .result-card { padding:1.3rem 1rem; }
  .result-detail { grid-template-columns:1fr; }
}

/* ========== iPad 适配（600–1100px） ========== */
@media (min-width: 601px) and (max-width: 1100px) {
  .page { padding:1.4rem 1.6rem 3rem; max-width:920px; }
  .unit-list { grid-template-columns:repeat(2,1fr); }
  .ach-grid { grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); }
  .stat-cards { grid-template-columns:repeat(4,1fr); }
  .quick-grid { grid-template-columns:repeat(4,1fr); }
  .quiz-card { max-width:680px; padding:2rem 1.6rem; }
  .quiz-q { font-size:1.9rem; }
  .keypad { max-width:380px; }
  .keypad-btn { padding:.95rem 0; font-size:1.3rem; }
  .choice-btn { padding:1.05rem; font-size:1.15rem; }
}

/* iPad 竖屏课程三列、答题居中更舒展 */
@media (min-width: 768px) and (max-width: 1100px) and (orientation: portrait) {
  .unit-list { grid-template-columns:repeat(2,1fr); }
  .quiz-choices { grid-template-columns:1fr 1fr; gap:.8rem; }
}

/* 横屏手机：紧凑布局 */
@media (max-height: 480px) and (orientation: landscape) {
  .topbar { position:static; }
  .dash-hero { flex-direction:row; padding:.9rem 1.2rem; }
  .goal-ring-wrap, .goal-ring { width:84px; height:84px; }
  .quiz-card { max-height:calc(100dvh - 96px); padding:.9rem .9rem; }
  .quiz-q { min-height:2.4rem; font-size:1.25rem; margin:.4rem 0 .7rem; }
  .quiz-choices { grid-template-columns:1fr 1fr 1fr; gap:.5rem; }
  .choice-btn { padding:.6rem; font-size:1rem; min-height:0; }
  .keypad { grid-template-columns:repeat(6,1fr); gap:.4rem; max-width:460px; }
  .keypad-btn { padding:.5rem 0; font-size:1.1rem; }
  .quiz-input { font-size:1.2rem; padding:.4rem; margin-bottom:.4rem; }
  .section-title { margin:.8rem 0 .5rem; }
}

/* 触屏设备：去掉悬停位移，避免粘手 */
@media (hover: none) {
  .reco-card:hover, .grade-card:hover, .unit-card:hover, .quick-card:hover,
  .mode-btn:hover, .btn-primary:hover { transform:none; }
  .btn-primary:active, .choice-btn:active, .keypad-btn:active,
  .quick-card:active, .mode-btn:active { transform:scale(.97); }
}

</style>
</head>
<body>

<!-- 漂浮装饰背景 -->
<div class="bg-decor" id="bgDecor"></div>

<!-- ===================== 登录 / 注册 ===================== -->
<section id="authView" class="view active">
  <div class="auth-card pop-in">
    <div class="auth-logo">🏰</div>
    <h1 class="auth-title">数学王国</h1>
    <p class="auth-sub">小学 1 ~ 3 年级沉浸式数学乐园</p>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">登 录</button>
      <button class="auth-tab" data-tab="register">注 册</button>
    </div>
    <div class="auth-form">
      <input type="text" id="authUser" placeholder="👤 用户名（2-12个字符）" maxlength="12" autocomplete="off">
      <input type="password" id="authPass" placeholder="🔒 密码（至少4位）" maxlength="20">
      <input type="password" id="authPass2" placeholder="🔒 确认密码" maxlength="20" style="display:none">
      <button class="btn btn-primary btn-lg" id="authSubmit">开始冒险 🚀</button>
      <p class="auth-msg" id="authMsg"></p>
    </div>
    <p class="auth-tip">✨ 账号数据保存在本机浏览器中</p>
  </div>
</section>

<!-- ===================== 主应用 ===================== -->
<section id="appView" class="view">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="topbar-left" onclick="showView('dashboardView')">
      <span class="logo">🏰</span><span class="logo-text">数学王国</span>
    </div>
    <nav class="topnav">
      <button class="nav-btn active" data-nav="dashboardView">🏠 首页</button>
      <button class="nav-btn" data-nav="learnView">📚 课程</button>
      <button class="nav-btn" data-nav="wrongView">📒 错题本</button>
      <button class="nav-btn" data-nav="achieveView">🏆 成就</button>
      <button class="nav-btn" data-nav="statsView">📊 统计</button>
    </nav>
    <div class="topbar-right">
      <div class="streak-pill" title="连续学习天数">🔥 <span id="streakNum">0</span> 天</div>
      <div class="star-pill" title="累计星星">⭐ <span id="starNum">0</span></div>
      <div class="user-chip" id="userChip">
        <span class="user-avatar" id="userAvatar">🧒</span>
        <span id="userName"></span>
        <div class="user-menu" id="userMenu">
          <button onclick="logout()">🚪 退出登录</button>
        </div>
      </div>
    </div>
  </header>

  <!-- 首页仪表盘 -->
  <div id="dashboardView" class="page active">
    <div class="dash-hero pop-in">
      <div class="dash-hello">
        <h2 id="helloText">你好！</h2>
        <p id="helloSub">今天也要开心学数学哦～</p>
        <div class="level-wrap">
          <div class="level-badge" id="levelBadge">Lv.1</div>
          <div class="level-info">
            <div class="level-name" id="levelName">数学小苗</div>
            <div class="level-bar"><div class="level-fill" id="levelFill"></div></div>
            <div class="level-xp" id="levelXp">0 / 100 XP</div>
          </div>
        </div>
      </div>
      <div class="goal-ring-wrap">
        <svg class="goal-ring" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
          <circle class="ring-fill" id="goalRing" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="goal-center">
          <div class="goal-num" id="goalNum">0/20</div>
          <div class="goal-label">今日答题目标</div>
        </div>
      </div>
    </div>

    <h3 class="section-title">🧭 为你推荐</h3>
    <div class="reco-list" id="recoList"></div>

    <h3 class="section-title">📚 我的课程进度</h3>
    <div class="grade-cards" id="gradeCards"></div>

    <h3 class="section-title">🚀 快捷入口</h3>
    <div class="quick-grid">
      <button class="quick-card q-oral" onclick="quickStart('oral')"><span class="quick-icon">⚡</span>口算大挑战<small>60秒极速口算</small></button>
      <button class="quick-card q-practice" onclick="quickStart('practice')"><span class="quick-icon">✏️</span>数学练习<small>巩固知识点</small></button>
      <button class="quick-card q-test" onclick="quickStart('test')"><span class="quick-icon">📝</span>综合测试<small>40分钟大闯关</small></button>
      <button class="quick-card q-wrong" onclick="quickStart('retrain')"><span class="quick-icon">📒</span>错题重练<small>攻克薄弱点</small></button>
    </div>
  </div>

  <!-- 课程页 -->
  <div id="learnView" class="page">
    <div class="grade-tabs" id="gradeTabs"></div>
    <div class="unit-list" id="unitList"></div>
  </div>

  <!-- 错题本页 -->
  <div id="wrongView" class="page">
    <div class="wrong-head">
      <div>
        <h3 class="section-title" style="margin-top:0">📒 我的错题本</h3>
        <p class="wrong-sub" id="wrongSub"></p>
      </div>
      <div class="wrong-actions">
        <button class="btn btn-primary" id="retrainBtn" onclick="startRetrain()">▶️ 开始专项重练</button>
        <button class="btn btn-ghost" id="clearMasteredBtn" onclick="clearMastered()">🧹 清空已掌握</button>
      </div>
    </div>
    <div class="wrong-filter" id="wrongFilter"></div>
    <div class="wrong-list" id="wrongList"></div>
  </div>

  <!-- 成就页 -->
  <div id="achieveView" class="page">
    <h3 class="section-title">🏆 成就勋章墙 <span class="ach-count" id="achCount"></span></h3>
    <div class="ach-grid" id="achGrid"></div>
  </div>

  <!-- 统计页 -->
  <div id="statsView" class="page">
    <div class="stat-cards" id="statCards"></div>
    <h3 class="section-title">📅 最近7天学习量</h3>
    <div class="chart-box"><div class="bar-chart" id="weekChart"></div></div>
    <h3 class="section-title">📖 各单元掌握情况</h3>
    <div class="unit-stats" id="unitStats"></div>
  </div>
</section>

<!-- ===================== 单元详情（选模式） ===================== -->
<div class="modal-mask" id="unitModal">
  <div class="modal-card pop-in">
    <button class="modal-close" onclick="closeModal('unitModal')">✕</button>
    <div class="unit-modal-head" id="umHead"></div>
    <p class="unit-modal-desc" id="umDesc"></p>
    <div class="unit-modal-progress" id="umProgress"></div>
    <div class="mode-btns">
      <button class="mode-btn m-oral" onclick="startQuiz('oral')"><span>⚡</span>口算<small>60秒计时</small></button>
      <button class="mode-btn m-practice" onclick="startQuiz('practice')"><span>✏️</span>练习<small>10题巩固</small></button>
      <button class="mode-btn m-test" onclick="startQuiz('test')"><span>📝</span>测试<small>10题检验</small></button>
    </div>
  </div>
</div>

<!-- ===================== 答题页 ===================== -->
<section id="quizView" class="view">
  <div class="quiz-top">
    <button class="btn btn-ghost" onclick="quitQuiz()">✕ 退出</button>
    <div class="quiz-title" id="quizTitle">口算挑战</div>
    <div class="quiz-timer" id="quizTimer">⏱ 60</div>
  </div>
  <div class="quiz-progress"><div class="quiz-progress-fill" id="quizProgressFill"></div></div>

  <div class="quiz-card" id="quizCard">
    <div class="quiz-streak" id="quizStreak"></div>
    <div class="quiz-q" id="quizQ"></div>
    <div class="quiz-choices" id="quizChoices"></div>
    <div class="quiz-input-wrap" id="quizInputWrap">
      <input type="number" id="quizInput" class="quiz-input" placeholder="?" autocomplete="off">
      <div class="keypad" id="keypad"></div>
    </div>
    <div class="quiz-steps" id="quizSteps" style="display:none"></div>
    <div class="quiz-actions">
      <button class="btn btn-hint" id="hintBtn" onclick="showHint()">💡 提示</button>
      <button class="btn btn-primary" id="quizSubmit" onclick="submitAnswer()">确定 ✔</button>
    </div>
    <div class="quiz-feedback" id="quizFeedback"></div>
  </div>
</section>

<!-- ===================== 结果页 ===================== -->
<section id="resultView" class="view">
  <div class="result-card pop-in">

<script>
/* ===================== 题目生成器 ===================== */
/* 每题返回 { q, a, type:'num'|'choice', choices?, hint, explain? }
   type=num  → 数字键盘输入；type=choice → 选择题，a 为正确选项文本 */

function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[rnd(0, arr.length - 1)]; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
/* 生成数字选择题（含正确答案 + 3 个干扰项） */
function numChoice(answer, spread) {
  const set = new Set([answer]);
  let guard = 0;
  while (set.size < 4 && guard++ < 60) {
    let d = answer + rnd(-spread, spread);
    if (d >= 0 && d !== answer) set.add(d);
  }
  while (set.size < 4) set.add(answer + set.size + rnd(1, 3));
  return shuffle([...set].map(String));
}

const GENERATORS = {
  /* ---------- 一年级 ---------- */
  count20() {
    const n = rnd(4, 20);
    const e = pick(["🍎","🌟","🐤","🎈","🍓","🐠","🌸","🚗"]);
    let row = "";
    for (let i = 0; i < n; i++) row += e + ((i + 1) % 10 === 0 ? "<br>" : "");
    return { q: `数一数，一共有多少个？<br><span style="font-size:1.6rem">${row}</span>`, a: n, type: "num",
      hint: "从左到右一个一个数，数过的做记号，就不会数漏啦。" };
  },
  addSub10() {
    if (Math.random() < 0.5) {
      const a = rnd(1, 9), b = rnd(1, 10 - a);
      return { q: `${a} + ${b} = ?`, a: a + b, type: "num", hint: "可以伸出手指接着数，也可以想凑十。" };
    }
    const a = rnd(2, 10), b = rnd(1, a);
    return { q: `${a} − ${b} = ?`, a: a - b, type: "num", hint: `先想 ${b} + ? = ${a}，倒过来算减法。` };
  },
  addSub20() {
    const kind = Math.random();
    if (kind < 0.4) { // 进位加
      const a = rnd(5, 9), b = rnd(11 - a, 9);
      return { q: `${a} + ${b} = ?`, a: a + b, type: "num", hint: `用凑十法：先把 ${b} 分成 ${10 - a} 和 ${b - (10 - a)}。` };
    } else if (kind < 0.75) { // 退位减
      const a = rnd(11, 18), b = rnd(a - 9 > 1 ? a - 9 : 2, 9);
      return { q: `${a} − ${b} = ?`, a: a - b, type: "num", hint: `破十法：把 ${a} 分成 10 和 ${a - 10}，先算 10 − ${b}。` };
    }
    const a = rnd(10, 20), b = rnd(1, 9);
    return { q: `${a} − ${b} = ?`, a: a - b, type: "num", hint: "把十几分成 10 和几，再算一算。" };
  },
  compare() {
    const style = rnd(1, 3);
    let left, right, la, ra;
    if (style === 1) { la = rnd(3, 20); ra = rnd(3, 20); left = String(la); right = String(ra); }
    else if (style === 2) { const a = rnd(2, 9), b = rnd(1, 8); la = a + b; left = `${a} + ${b}`; ra = rnd(3, 18); right = String(ra); }
    else { const a = rnd(9, 18), b = rnd(2, 8); la = a - b; left = `${a} − ${b}`; ra = rnd(2, 15); right = String(ra); }
    if (la === ra) { ra = ra + 1; right = String(ra); }
    const ans = la > ra ? ">" : "<";
    return { q: `在 ○ 里填上 &gt; 或 &lt;<br><span style="font-size:1.7rem">${left} ○ ${right}</span>`, a: ans, type: "choice",
      choices: [">", "<"], hint: "先分别算出两边的结果，再比一比谁大谁小。大口朝大数！" };
  },
  shapes() {
    const bank = [
      { q: "下面哪个图形有 <b>3 条边、3 个角</b>？", a: "三角形 △", choices: ["三角形 △", "正方形 □", "圆 ●", "长方形 ▭"] },
      { q: "下面哪个图形 <b>4 条边都一样长，4 个角都是直角</b>？", a: "正方形 □", choices: ["长方形 ▭", "正方形 □", "三角形 △", "圆 ●"] },
      { q: "下面哪个图形 <b>没有角</b>？", a: "圆 ●", choices: ["三角形 △", "长方形 ▭", "圆 ●", "正方形 □"] },
      { q: "数学书的封面最像哪个图形？", a: "长方形 ▭", choices: ["圆 ●", "三角形 △", "长方形 ▭", "正方形 □"] },
      { q: "红领巾的形状最像哪个图形？", a: "三角形 △", choices: ["三角形 △", "圆 ●", "正方形 □", "长方形 ▭"] }
    ];
    const it = pick(bank);
    return { q: it.q, a: it.a, type: "choice", choices: shuffle(it.choices), hint: "想一想每个图形的特点：几条边？几个角？" };
  },
  position() {
    const animals = ["🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼"];
    const n = rnd(4, 6);
    const row = shuffle(animals).slice(0, n);
    const idx = rnd(0, n - 1);
    const fromLeft = Math.random() < 0.5;
    const pos = fromLeft ? idx + 1 : n - idx;
    const cn = ["一","二","三","四","五","六"];
    const em = e => `<span class="emoji">${e}</span>`;
    return {
      q: `<span class="emoji-row">${row.map(em).join(" ")}</span>小动物排排队，${em(row[idx])}从<b>${fromLeft ? "左" : "右"}</b>边数排第几？`,
      a: pos, type: "num",
      hint: `从${fromLeft ? "左" : "右"}边开始数：第${cn[0]}、第${cn[1]}…… 一边指一边数。`,
      explain: `从${fromLeft ? "左" : "右"}边数，${row[idx]} 排第 ${pos}。`
    };
  },

  /* ---------- 二年级 ---------- */
  addSub100() {
    if (Math.random() < 0.5) {
      const a = rnd(15, 80), b = rnd(10, 99 - a);
      return { q: `${a} + ${b} = ?`, a: a + b, type: "num", hint: "先加个位，再加十位；个位满十要向十位进 1。" };
    }
    const a = rnd(30, 99), b = rnd(11, a - 5);
    return { q: `${a} − ${b} = ?`, a: a - b, type: "num", hint: "个位不够减时，要向十位借 1 当 10。" };
  },
  mul() {
    const a = rnd(2, 9), b = rnd(2, 9);
    return { q: `${a} × ${b} = ?`, a: a * b, type: "num", hint: `想乘法口诀：${cnNum(a)}${cnNum(b)}${cnNum(a * b)}。` };
  },
  length() {
    const kind = rnd(1, 3);
    if (kind === 1) {
      const m = rnd(1, 9);
      return { q: `${m} 米 = ? 厘米`, a: m * 100, type: "num", hint: "1 米 = 100 厘米。" };
    } else if (kind === 2) {
      const cm = rnd(1, 9) * 100;
      return { q: `${cm} 厘米 = ? 米`, a: cm / 100, type: "num", hint: "100 厘米 = 1 米。" };
    }
    const a = rnd(20, 95), er = rnd(2, 10);
    return { q: `小明的铅笔长 ${a} 厘米，橡皮长 ${er} 厘米，铅笔比橡皮长多少厘米？`, a: a - er, type: "num", hint: "求“长多少”用减法。" };
  },
  angle() {
    const bank = [
      { q: "一个三角形有几个角？", a: "3", type: "num", hint: "三角形 = 三条边 + 三个角。" },
      { q: "长方形有几个直角？", a: "4", type: "num", hint: "长方形的 4 个角都是直角。" },
      { q: "比直角小的角叫什么角？", a: "锐角", type: "choice", choices: ["锐角", "直角", "钝角"], hint: "锐角尖尖小，钝角张开大。" },
      { q: "比直角大的角叫什么角？", a: "钝角", type: "choice", choices: ["锐角", "直角", "钝角"], hint: "钝角张开得比直角大。" },
      { q: "红领巾上有几个钝角？", a: "1", type: "num", hint: "红领巾是三角形，有 1 个钝角和 2 个锐角。" },
      { q: "下面哪个物体的角是直角？", a: "数学书的角", type: "choice", choices: ["数学书的角", "张开的剪刀（很小）", "扇子的边"], hint: "数学书、黑板的角都是直角。" }
    ];
    return pick(bank);
  },
  clock() {
    const kind = rnd(1, 3);
    if (kind === 1) {
      const h = rnd(1, 12);
      return { q: `钟面上时针指着 ${h}，分针指着 12，是几时？`, a: `${h}时`, type: "choice",
        choices: shuffle([`${h}时`, `${h % 12 + 1}时`, `${(h + 10) % 12 + 1}时`, `${h}时半`]), hint: "分针指 12，时针指几就是几时。" };
    } else if (kind === 2) {
      const h = rnd(1, 12);
      return { q: `钟面上时针走过 ${h}，分针指着 6，是几时半？`, a: `${h}时半`, type: "choice",
        choices: shuffle([`${h}时半`, `${h}时`, `${h % 12 + 1}时半`, `12时半`]), hint: "分针指 6 就是半时，时针走过几就是几时半。" };
    }
    const h = rnd(1, 11), m = pick([5, 10, 15, 20, 25]);
    return { q: `早上 ${h}:${String(m).padStart(2, "0")} 上课，过 1 小时是几时几分？`, a: `${h + 1}:${String(m).padStart(2, "0")}`, type: "choice",
      choices: shuffle([`${h + 1}:${String(m).padStart(2, "0")}`, `${h}:${String(m).padStart(2, "0")}`, `${h + 2}:${String(m).padStart(2, "0")}`, `${h + 1}:00`]),
      hint: "过 1 小时，分钟不变，小时加 1。" };
  },
  word2() {
    const kind = rnd(1, 4);
    if (kind === 1) {
      const a = rnd(12, 35), b = rnd(5, 18);
      return { q: `小明有 ${a} 张贴纸，送给小红 ${b} 张，还剩多少张？`, a: a - b, type: "num", hint: "送出去用减法。" };
    } else if (kind === 2) {
      const a = rnd(6, 9), b = rnd(3, 8);
      return { q: `每盒有 ${a} 支彩笔，${b} 盒一共有多少支？`, a: a * b, type: "num", hint: `求几个几用乘法：${a} × ${b}。` };
    } else if (kind === 3) {
      const b = rnd(4, 8), each = rnd(3, 9), a = b * each;
      return { q: `${a} 个苹果平均放进 ${b} 个盘子，每盘放几个？`, a: each, type: "num", hint: `平均分用除法：${a} ÷ ${b}。` };
    }
    const a = rnd(15, 40), b = rnd(8, 20), c = rnd(3, 12);
    return { q: `停车场原来有 ${a} 辆车，开走 ${b} 辆，又开来 ${c} 辆，现在有多少辆？`, a: a - b + c, type: "num", hint: `先算 ${a} − ${b}，再加上 ${c}。` };
  },

  /* ---------- 三年级 ---------- */
  addSub10000() {
    if (Math.random() < 0.5) {
      const a = rnd(200, 5000), b = rnd(100, 4000);
      return { q: `${a} + ${b} = ?`, a: a + b, type: "num", hint: "相同数位对齐，从个位加起，满十进一。" };
    }
    const a = rnd(1000, 9000), b = rnd(200, a - 100);
    return { q: `${a} − ${b} = ?`, a: a - b, type: "num", hint: "相同数位对齐，不够减向前一位借 1 当 10。" };
  },
  mulMulti() {
    const kind = rnd(1, 3);
    if (kind === 1) { const a = rnd(12, 99), b = rnd(2, 9); return { q: `${a} × ${b} = ?`, a: a * b, type: "num", hint: `先算个位 ${a % 10}×${b}，再算十位 ${Math.floor(a / 10)}0×${b}，最后相加。` }; }
    if (kind === 2) { const a = rnd(110, 500), b = rnd(2, 6); return { q: `${a} × ${b} = ?`, a: a * b, type: "num", hint: "把三位数拆成几百、几十、几分别乘，再相加。" }; }
    const b = rnd(3, 9), c = rnd(2, 9);
    return { q: `${b} × ${c} × 10 = ?`, a: b * c * 10, type: "num", hint: `先算 ${b} × ${c}，再在结果末尾添一个 0。` };
  },
  div() {
    const kind = rnd(1, 3);
    if (kind === 1) { const b = rnd(2, 9), q = rnd(2, 9); return { q: `${b * q} ÷ ${b} = ?`, a: q, type: "num", hint: `想乘法口诀：${cnNum(b)}${cnNum(q)}${cnNum(b * q)}。` }; }
    if (kind === 2) { const b = rnd(2, 6), q = rnd(12, 60); return { q: `${b * q} ÷ ${b} = ?`, a: q, type: "num", hint: "从最高位除起，除到哪一位商就写在哪一位上。" }; }
    const b = rnd(2, 9), q = rnd(3, 9), r = rnd(1, b - 1);
    return { q: `${b * q + r} ÷ ${b} = ? （商是多少？余数不用写）`, a: q, type: "num", hint: `先想 ${b} 乘几最接近但不超过被除数。` };
  },
  fraction() {
    const kind = rnd(1, 3);
    if (kind === 1) {
      const d = pick([2, 3, 4, 6, 8]);
      return { q: `把一个蛋糕平均分成 ${d} 份，每份是它的几分之一？`, a: `1/${d}`, type: "choice",
        choices: shuffle([`1/${d}`, `1/${d === 2 ? 4 : d - 1}`, `${d}/1`, `1/${d + 2}`]), hint: "平均分成几份，每份就是几分之一。" };
    } else if (kind === 2) {
      const a = pick([2, 4, 6, 8]), b = pick([3, 5, 7, 9]);
      const ans = a < b ? `1/${a}` : `1/${b}`;
      return { q: `比一比：1/${a} ○ 1/${b}，哪个更大？`, a: ans, type: "choice",
        choices: shuffle([`1/${a}`, `1/${b}`]), hint: "分的份数越少，每一份就越大！" };
    }
    const d = pick([4, 6, 8]), n = rnd(2, d - 1);
    return { q: `一张纸条平均分成 ${d} 份，涂色 ${n} 份，涂色部分是几分之几？`, a: `${n}/${d}`, type: "choice",
      choices: shuffle([`${n}/${d}`, `${d}/${n}`, `${n - 1}/${d}`, `1/${d}`]), hint: `分母是 ${d}（总份数），分子是 ${n}（涂色份数）。` };
  },
  periArea() {
    const kind = rnd(1, 4);
    if (kind === 1) { const w = rnd(2, 12), h = rnd(2, 12); return { q: `长方形长 ${Math.max(w, h)} 厘米，宽 ${Math.min(w, h)} 厘米，周长是多少厘米？`, a: 2 * (w + h), type: "num", hint: "长方形周长 =（长 + 宽）× 2。" }; }
    if (kind === 2) { const s = rnd(2, 12); return { q: `正方形边长 ${s} 厘米，周长是多少厘米？`, a: 4 * s, type: "num", hint: "正方形周长 = 边长 × 4。" }; }
    if (kind === 3) { const w = rnd(2, 12), h = rnd(2, 12); return { q: `长方形长 ${Math.max(w, h)} 厘米，宽 ${Math.min(w, h)} 厘米，面积是多少平方厘米？`, a: w * h, type: "num", hint: "长方形面积 = 长 × 宽。" }; }
    const s = rnd(2, 12); return { q: `正方形边长 ${s} 分米，面积是多少平方分米？`, a: s * s, type: "num", hint: "正方形面积 = 边长 × 边长。" };
  },
  decimal() {
    const kind = rnd(1, 3);
    if (kind === 1) {
      const a = rnd(1, 9) / 10 + rnd(0, 9), b = rnd(1, 9) / 10 + rnd(0, 5);
      const s = (Math.round(a * 10) + Math.round(b * 10)) / 10;
      return { q: `${a.toFixed(1)} + ${b.toFixed(1)} = ?`, a: s.toFixed(1), type: "choice",
        choices: numChoice(parseFloat(s.toFixed(1)), 3).map(v => parseFloat(v).toFixed(1)), hint: "小数点对齐，像整数一样相加，满十进一。" };
    } else if (kind === 2) {
      const a = rnd(25, 98) / 10, b = rnd(5, Math.floor(a * 10) - 5) / 10;
      const s = (Math.round(a * 10) - Math.round(b * 10)) / 10;
      return { q: `${a.toFixed(1)} − ${b.toFixed(1)} = ?`, a: s.toFixed(1), type: "choice",
        choices: numChoice(parseFloat(s.toFixed(1)), 3).map(v => parseFloat(v).toFixed(1)), hint: "小数点对齐再减，不够减向前借 1。" };
    }
    const a = rnd(11, 99) / 10, b = rnd(11, 99) / 10;
    if (a === b) return GENERATORS.decimal();
    return { q: `比一比：${a.toFixed(1)} ○ ${b.toFixed(1)}`, a: a > b ? ">" : "<", type: "choice",
      choices: [">", "<"], hint: "先比整数部分，整数部分相同再比小数部分。" };
  },
  calendar() {
    const bank = [
      { q: "一年有几个月？", a: "12", type: "num", hint: "从 1 月数到 12 月。" },
      { q: "下面哪个月是大月（31天）？", a: "7月", type: "choice", choices: shuffle(["7月", "4月", "6月", "9月"]), hint: "一三五七八十腊，三十一天永不差。" },
      { q: "下面哪个月是小月（30天）？", a: "6月", type: "choice", choices: shuffle(["6月", "1月", "3月", "8月"]), hint: "4、6、9、11 月是小月。" },
      { q: "平年的 2 月有多少天？", a: "28", type: "num", hint: "平年 2 月 28 天，闰年 2 月 29 天。" },
      { q: "平年全年有多少天？", a: "365", type: "num", hint: "平年 365 天，闰年 366 天。" },
      { q: "2024 年是闰年，它的 2 月有多少天？", a: "29", type: "num", hint: "闰年 2 月有 29 天。" },
      { q: "儿童节是 6 月 1 日，前一天是几月几日？", a: "5月31日", type: "choice", choices: shuffle(["5月31日", "5月30日", "5月29日", "6月2日"]), hint: "5 月是大月，有 31 天。" }
    ];
    return pick(bank);
  },
  word3() {
    const kind = rnd(1, 4);
    if (kind === 1) {
      const each = rnd(4, 9), box = rnd(3, 8);
      return { q: `每盒装 ${each} 个月饼，${box} 盒一共装多少个月饼？`, a: each * box, type: "num", hint: "求几个几用乘法：每盒个数 × 盒数。" };
    } else if (kind === 2) {
      const per = rnd(3, 9), groups = rnd(2, 6);
      return { q: `学校买来 ${per * groups * 10} 本图书，平均分给 ${groups} 个班，每个班分到多少本？`, a: per * 10, type: "num", hint: `平均分用除法：${per * groups * 10} ÷ ${groups}。` };
    } else if (kind === 3) {
      const a = rnd(120, 400), b = rnd(50, 200);
      return { q: `果园里有苹果树 ${a} 棵，梨树比苹果树少 ${b} 棵，两种树一共有多少棵？`, a: a - b + a, type: "num", hint: `先求梨树：${a} − ${b}，再加上苹果树。` };
    }
    const w = rnd(3, 9), l = w + rnd(1, 5);
    return { q: `一块长方形菜地长 ${l} 米，宽 ${w} 米，四周围上篱笆，篱笆长多少米？`, a: 2 * (l + w), type: "num", hint: "篱笆长就是长方形的周长。" };
  }
};

/* ---------- 进阶练习：分步解题（凑十法 / 破十法） ---------- */
/* 初级：20以内加减法（进位加 + 退位减，结果不超过 20） */
function advAddA() {
  let a = 0, b = 0, need = 0, rest = 0, guard = 0;
  do {
    a = rnd(5, 9);
    need = 10 - a;                       // 还差几凑成 10
    const maxB = Math.min(9, 20 - a);    // 和不超过 20
    if (maxB <= need) continue;
    b = rnd(need + 1, maxB);
    rest = b - need;
  } while (!b && guard++ < 200);
  const ten = a + need, sum = a + b;
  return {
    q: `${a} + ${b} = ?`, a: sum, type: "num", method: "凑十法",
    hint: `凑十法：把 ${b} 分成 ${need} 和 ${rest}。`,
    explain: `${a} + ${need} = ${ten}，${ten} + ${rest} = ${sum}。`,
    steps: [
      { prompt: `${a} 再添 {} 就到 ${ten}`, ans: need },
      { prompt: `把 ${b} 分成 ${need} 和 {}`, ans: rest },
      { prompt: `${a} + ${need} = {}`, ans: ten },
      { prompt: `${ten} + ${rest} = {}`, ans: sum }
    ]
  };
}

/* 进阶：两位数 ± 两位数 */
function advAddB() {
  let a = 0, b = 0, need = 0, rest = 0, guard = 0;
  do {
    a = rnd(11, 26);
    const o = a % 10;
    if (o === 0) continue;
    need = 10 - o;
    const minB = Math.max(10, need + 1);
    const maxB = 40 - a;
    if (maxB < minB) continue;
    b = rnd(minB, maxB);
    rest = b - need;
    if (rest < 1 || a + b > 40) b = 0;
  } while (!b && guard++ < 300);
  const ten = a + need, sum = a + b;
  return {
    q: `${a} + ${b} = ?`, a: sum, type: "num", method: "凑十法",
    hint: `凑十法：把 ${b} 分成 ${need} 和 ${rest}。`,
    explain: `${a} + ${need} = ${ten}，${ten} + ${rest} = ${sum}。`,
    steps: [
      { prompt: `${a} 再添 {} 就到 ${ten}`, ans: need },
      { prompt: `把 ${b} 分成 ${need} 和 {}`, ans: rest },
      { prompt: `${a} + ${need} = {}`, ans: ten },
      { prompt: `${ten} + ${rest} = {}`, ans: sum }
    ]
  };
}

/* 破十法拆分：把 a 分成 (整十部分) 和 (10 + 个位) */
function advSplit(a) {
  const o = a % 10;
  if (a < 20) return { q: o, r: 10 };                       // 13 → 3 和 10
  return { q: (Math.floor(a / 10) - 1) * 10, r: 10 + o };   // 32 → 20 和 12
}

function advSubA() {
  let a = 0, b = 0, guard = 0;
  do {
    a = rnd(11, 18);                   // 十几减几，结果在 20 以内
    const o = a % 10;
    if (o === 0 || o >= 9) continue;   // 个位必须不够减
    b = rnd(o + 1, 9);
  } while (!b && guard++ < 200);
  const { q: q10, r: r10 } = advSplit(a);
  const res = r10 - b, ans = q10 + res;
  return {
    q: `${a} − ${b} = ?`, a: ans, type: "num", method: "破十法",
    hint: `破十法：把 ${a} 分成 ${q10} 和 ${r10}，先算 ${r10} − ${b}。`,
    explain: `${r10} − ${b} = ${res}，${q10} + ${res} = ${ans}。`,
    steps: [
      { prompt: `把 ${a} 分成 ${q10} 和 {}`, ans: r10 },
      { prompt: `${r10} − ${b} = {}`, ans: res },
      { prompt: `${q10} + ${res} = {}`, ans: ans }
    ]
  };
}

function advSubB() {
  let a = 0, b = 0, guard = 0;
  do {
    a = rnd(20, 40);
    const oa = a % 10;
    b = rnd(10, a - 1);
    const ob = b % 10;
    if (!(oa < ob)) b = 0;             // 个位不够减，才用破十法
  } while (!b && guard++ < 300);
  const oa = a % 10, ob = b % 10;
  const qA = (Math.floor(a / 10) - 1) * 10, rA = 10 + oa;   // 35 → 20 和 15
  const qB = Math.floor(b / 10) * 10;                       // 17 → 10 和 7
  const resOnes = rA - ob, resTens = qA - qB;
  const ans = resTens + resOnes;
  return {
    q: `${a} − ${b} = ?`, a: ans, type: "num", method: "破十法",
    hint: `破十法：把 ${a} 分成 ${qA} 和 ${rA}，把 ${b} 分成 ${qB} 和 ${ob}。`,
    explain: `${rA} − ${ob} = ${resOnes}，${qA} − ${qB} = ${resTens}，${resTens} + ${resOnes} = ${ans}。`,
    steps: [
      { prompt: `把 ${a} 分成 ${qA} 和 {}`, ans: rA },
      { prompt: `把 ${b} 分成 ${qB} 和 {}`, ans: ob },
      { prompt: `${rA} − ${ob} = {}`, ans: resOnes },
      { prompt: `${qA} − ${qB} = ${resTens}，${resTens} + ${resOnes} = {}`, ans: ans }
    ]
  };
}

const ADVANCE_GENERATORS = {
  a: { add: advAddA, sub: advSubA },
  b: { add: advAddB, sub: advSubB }
};

function cnNum(n) {
  const cn = ["零","一","二","三","四","五","六","七","八","九","十"];
  if (n <= 10) return cn[n];
  if (n < 20) return "十" + cn[n - 10];
  if (n < 100) { const t = Math.floor(n / 10), o = n % 10; return cn[t] + "十" + (o ? cn[o] : ""); }
  return String(n);
}

/* 统一入口：按单元 gen key 出题 */
function makeQuestion(genKey) {
  const fn = GENERATORS[genKey];
  const q = fn();
  if (q.type === "num") q.a = String(q.a);
  return q;
}

<script>
/* ===================== 数学王国 · 主程序 ===================== */
"use strict";

/* ---------- 数据存取 ---------- */
const LS_USERS = "mk_users";
const LS_CUR = "mk_current";

function loadUsers() { try { return JSON.parse(localStorage.getItem(LS_USERS)) || {}; } catch (e) { return {}; } }
function saveUsers(u) { localStorage.setItem(LS_USERS, JSON.stringify(u)); }
function dataKey(name) { return "mk_data_" + name; }

function blankData() {
  return {
    xp: 0, stars: 0, totalQ: 0, correctQ: 0,
    streak: 0, lastDate: null,
    days: {},            // "2026-10-13": {q, c}
    units: {},           // unitId: {stars, best, attempts, totalQ, correctQ, modes:{}}
    gradeTests: {},      // grade: bestScore
    advance: {},         // 进阶练习难度 a/b: {attempts,totalQ,correctQ,best,stars}
    ach: {},             // achId: dateStr
    wrongs: []           // 错题本: {q, a, type, choices, hint, explain, unitTitle, icon, date, mastered, masteredCount}
  };
}
function loadData(name) {
  try {
    const d = JSON.parse(localStorage.getItem(dataKey(name)));
    return d ? Object.assign(blankData(), d) : blankData();
  } catch (e) { return blankData(); }
}
function saveData() { localStorage.setItem(dataKey(state.user), JSON.stringify(state.data)); }

/* ---------- 全局状态 ---------- */
const state = {
  user: null,
  data: null,
  gradeTab: 1,
  selUnit: null,     // 当前选中单元 {grade, unit}
  quiz: null,        // 答题状态
  wrongFilter: "todo" // 错题本筛选: todo | mastered | all
};
window.state = state; // 暴露给控制台调试/自动化测试

const $ = id => document.getElementById(id);
function todayStr(d = new Date()) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function stripHtml(s) { return String(s).replace(/<br\s*\/?>/g, " ").replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim(); }

/* ---------- 音效 ---------- */
let AC = null;
function beep(ok) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.frequency.value = ok ? 880 : 220;
    g.gain.setValueAtTime(0.08, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.25);
    o.start(); o.stop(AC.currentTime + 0.25);
  } catch (e) { /* 无声环境忽略 */ }
}

/* ---------- 彩带 ---------- */
function confetti(n = 70) {
  const box = $("confettiBox");
  const colors = ["#FF8F00", "#4A90E2", "#7ED321", "#FF5252", "#7E57C2", "#FFD54F"];
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = Math.random() * 0.4 + "s";
    c.style.borderRadius = Math.random() < 0.5 ? "50%" : "2px";
    box.appendChild(c);
    setTimeout(() => c.remove(), 2200);
  }
}

/* ===================== 注册 / 登录 ===================== */
let authMode = "login";
document.querySelectorAll(".auth-tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".auth-tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    authMode = t.dataset.tab;
    $("authPass2").style.display = authMode === "register" ? "block" : "none";
    $("authSubmit").textContent = authMode === "register" ? "创建账号 🎈" : "开始冒险 🚀";
    $("authMsg").textContent = "";
  };
});

$("authSubmit").onclick = doAuth;
$("authPass").addEventListener("keydown", e => { if (e.key === "Enter") doAuth(); });
$("authPass2").addEventListener("keydown", e => { if (e.key === "Enter") doAuth(); });

function doAuth() {
  const name = $("authUser").value.trim();
  const pass = $("authPass").value;
  const msg = $("authMsg");
  if (name.length < 2) return msg.textContent = "用户名至少 2 个字符哦";
  if (pass.length < 4) return msg.textContent = "密码至少 4 位哦";
  const users = loadUsers();

  if (authMode === "register") {
    if (pass !== $("authPass2").value) return msg.textContent = "两次输入的密码不一样";
    if (users[name]) return msg.textContent = "这个用户名已经被注册啦";
    users[name] = { pass: btoa(pass), avatar: AVATARS[Object.keys(users).length % AVATARS.length], created: todayStr() };
    saveUsers(users);
    loginAs(name, true);
  } else {
    if (!users[name] || users[name].pass !== btoa(pass)) return msg.textContent = "用户名或密码不对，再试试";
    loginAs(name, false);
  }
}

function loginAs(name, isNew) {
  state.user = name;
  state.data = loadData(name);
  localStorage.setItem(LS_CUR, name);
  if (isNew) unlockAch("welcome");
  enterApp();
}

function logout() {
  state.user = null; state.data = null;
  localStorage.removeItem(LS_CUR);
  $("appView").classList.remove("active");
  $("authView").classList.add("active");
}

/* ===================== 视图导航 ===================== */
const TOP_VIEWS = ["authView", "appView", "quizView", "resultView"];
function showView(id) {
  if (TOP_VIEWS.includes(id)) {
    TOP_VIEWS.forEach(v => $(v).classList.toggle("active", v === id));
    if (id === "appView") showPage("dashboardView");
    return;
  }
  showPage(id);
}
function showPage(id) {
  TOP_VIEWS.forEach(v => $(v).classList.toggle("active", v === "appView"));
  document.querySelectorAll("#appView .page").forEach(p => p.classList.toggle("active", p.id === id));
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.nav === id));
  if (id === "dashboardView") renderDashboard();
  if (id === "learnView") renderLearn();
  if (id === "achieveView") renderAchievements();
  if (id === "statsView") renderStats();
  if (id === "wrongView") renderWrongs();
}
document.querySelectorAll(".nav-btn").forEach(b => b.onclick = () => showPage(b.dataset.nav));
function backToApp() { showView("appView"); }
function backToLearn() { showPage("learnView"); } // 返回上一级：课程页继续选课

/* ===================== 进入应用 ===================== */
function enterApp() {
  $("authView").classList.remove("active");
  $("userName").textContent = state.user;
  $("userAvatar").textContent = loadUsers()[state.user].avatar || "🧒";
  updateStreakOnVisit();
  showView("appView");
}

function updateStreakOnVisit() {
  const d = state.data, t = todayStr();
  if (d.lastDate === t) return;
  const y = todayStr(new Date(Date.now() - 86400000));
  d.streak = (d.lastDate === y) ? d.streak + 1 : 1;
  d.lastDate = t;
  saveData();
}

/* ===================== 仪表盘 ===================== */
function levelOf(xp) {
  let cur = LEVELS[0], next = null;
  for (let i = 0; i < LEVELS.length; i++) {
    if (xp >= LEVELS[i].xp) cur = LEVELS[i]; else { next = LEVELS[i]; break; }
  }
  return { cur, next };
}

function renderDashboard() {
  const d = state.data;
  const h = new Date().getHours();
  const greet = h < 6 ? "夜深了" : h < 9 ? "早上好" : h < 12 ? "上午好" : h < 14 ? "中午好" : h < 18 ? "下午好" : "晚上好";
  $("helloText").textContent = `${greet}，${state.user}！`;
  $("helloSub").textContent = d.streak > 1 ? `已经连续学习 ${d.streak} 天啦，继续加油！` : "今天也要开心学数学哦～";

  // 等级
  const { cur, next } = levelOf(d.xp);
  $("levelBadge").textContent = "Lv." + cur.lv;
  $("levelName").textContent = cur.name;
  if (next) {
    const pct = Math.min(100, Math.round((d.xp - cur.xp) / (next.xp - cur.xp) * 100));
    $("levelFill").style.width = pct + "%";
    $("levelXp").textContent = `${d.xp} / ${next.xp} XP`;
  } else {
    $("levelFill").style.width = "100%";
    $("levelXp").textContent = `${d.xp} XP · 已满级`;
  }

  // 顶栏
  $("streakNum").textContent = d.streak;
  $("starNum").textContent = d.stars;

  // 今日目标
  const today = d.days[todayStr()] || { q: 0 };
  const goal = 20, pct2 = Math.min(100, today.q / goal * 100);
  $("goalRing").style.strokeDashoffset = 327 - 327 * pct2 / 100;
  $("goalNum").textContent = `${Math.min(today.q, goal)}/${goal}`;

  renderReco();
  renderGradeCards();
}

/* ---------- 个性化推荐 ---------- */
function allUnits() {
  const list = [];
  CURRICULUM.forEach(g => g.units.forEach(u => list.push({ grade: g.grade, gname: g.name, color: g.color, ...u })));
  return list;
}

function getRecommendations() {
  const d = state.data;
  const recos = [];
  const units = allUnits();

  // 1) 完全新手 → 第一课
  if (d.totalQ === 0) {
    const u = units[0];
    recos.push({ icon: "🌱", title: `从「${u.title}」开始`, desc: "这是数学王国的第一站，先来一次轻松练习吧！", grade: u.grade, unitId: u.id, mode: "practice" });
    return recos;
  }

  // 2) 待攻克错题 → 优先重练
  const todoWrongs = d.wrongs.filter(w => !w.mastered).length;
  if (todoWrongs >= 3) {
    recos.push({ icon: "📒", title: `重练 ${todoWrongs} 道错题`, desc: "错题不攻克，越积越多哦！现在就把它们消灭掉！", grade: 0, unitId: "wrongbook", mode: "retrain" });
  }

  // 3) 薄弱单元（有练习但正确率 < 70%）→ 复习
  const weak = units.filter(u => {
    const p = d.units[u.id];
    return p && p.totalQ >= 5 && p.correctQ / p.totalQ < 0.7;
  }).sort((a, b) => (d.units[a.id].correctQ / d.units[a.id].totalQ) - (d.units[b.id].correctQ / d.units[b.id].totalQ));
  if (weak.length) {
    const u = weak[0];
    const acc = Math.round(d.units[u.id].correctQ / d.units[u.id].totalQ * 100);
    recos.push({ icon: "💪", title: `复习「${u.title}」`, desc: `正确率 ${acc}%，再练一次把它变成强项！`, grade: u.grade, unitId: u.id, mode: "practice" });
  }

  // 4) 下一个未获星单元 → 新课
  const nextNew = units.find(u => !(d.units[u.id] && d.units[u.id].stars > 0));
  if (nextNew) {
    recos.push({ icon: "📖", title: `学习新课「${nextNew.title}」`, desc: `${nextNew.gname} · ${nextNew.desc}`, grade: nextNew.grade, unitId: nextNew.id, mode: "practice" });
  }

  // 5) 已练习但未测试的单元 → 挑战测试
  const needTest = units.find(u => {
    const p = d.units[u.id];
    return p && p.modes && p.modes.practice && !p.modes.test;
  });
  if (needTest) recos.push({ icon: "📝", title: `挑战「${needTest.title}」测试`, desc: "练习完成啦，来检验一下学习成果！", grade: needTest.grade, unitId: needTest.id, mode: "test" });

  // 6) 口算日常
  if (recos.length < 3) {
    const any = units.find(u => d.units[u.id]) || units[0];
    recos.push({ icon: "⚡", title: "每日口算打卡", desc: "60 秒口算挑战，让计算又快又准！", grade: any.grade, unitId: any.id, mode: "oral" });
  }

  if (!recos.length) recos.push({ icon: "👑", title: "你已通关全部课程！", desc: "试试挑战测试满分，成为真正的数学王者！", grade: 3, unitId: units[units.length - 1].id, mode: "test" });
  return recos.slice(0, 3);
}

/* 收录错题（自动去重；同一题反复错会刷新日期并恢复为未掌握） */
function addWrong(q, unit) {
  const d = state.data;
  const key = stripHtml(q.q) + "||" + q.a;
  const exist = d.wrongs.find(w => w._key === key);
  if (exist) {
    exist.date = todayStr();
    exist.mastered = false;
    return false;
  }
  d.wrongs.unshift({
    _key: key,
    q: q.q, a: q.a, type: q.type, choices: q.choices || null,
    hint: q.hint || null, explain: q.explain || null,
    unitTitle: unit.title, icon: unit.icon || "📗",
    date: todayStr(), mastered: false
  });
  // 容量上限 100：优先删最旧的已掌握，其次最旧的
    if (d.wrongs.length > 100) {
    let idx = -1;
    for (let i = d.wrongs.length - 1; i >= 0; i--) if (d.wrongs[i].mastered) { idx = i; break; }
    d.wrongs.splice(idx >= 0 ? idx : d.wrongs.length - 1, 1);
  }
  return true;
}

  });
